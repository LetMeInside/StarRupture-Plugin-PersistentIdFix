name: Build PersistentIdFix

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target (Server is the final legacy release)"
        required: true
        type: choice
        default: Client
        options:
          - Client
          - Server
      publish:
        description: "Publish GitHub Release and Nexus packages"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

# ============================================================
# Plugin-specific configuration
# ============================================================
# When reusing this workflow for another plugin repository,
# these are the main values to change.
#
# The version itself is NOT configured here.
# It comes from the numeric version definitions in Src/resource.h.
# ============================================================
env:
  PLUGIN_NAME: PersistentIdFix
  SOLUTION_FILE: PersistentIdFix.sln
  VERSION_HEADER: Src/resource.h
  CLIENT_CONFIGURATION: Client Release
  SERVER_CONFIGURATION: Server Release
  BUILD_TARGET: ${{ inputs.target }}
  BUILD_CONFIGURATION: ${{ inputs.target }} Release
  MANIFEST_TARGET: ${{ inputs.target == 'Client' && 'client' || 'server' }}

jobs:
  build:
    name: Build ${{ inputs.target }}
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
    runs-on: windows-latest

    steps:
      # --------------------------------------------------------
      # Checkout plugin repository
      # --------------------------------------------------------
      - name: Checkout plugin
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Reject publication from every ref except the release branch
      # --------------------------------------------------------
      - name: Enforce main-only publishing
        if: ${{ inputs.publish && github.ref != 'refs/heads/main' }}
        shell: pwsh
        run: |
          throw "Publishing is restricted to refs/heads/main. Current ref: $env:GITHUB_REF"

      # --------------------------------------------------------
      # Show exactly what is being built
      # --------------------------------------------------------
      - name: Show build revision
        shell: pwsh
        run: |
          Write-Host "Repository : $env:GITHUB_REPOSITORY"
          Write-Host "Ref        : $env:GITHUB_REF"
          Write-Host "Commit     : $env:GITHUB_SHA"
          Write-Host "Workspace  : $env:GITHUB_WORKSPACE"

      # Official SDK checkout; its root is passed explicitly to MSBuild below.
      - name: Checkout StarRupture Plugin SDK
        uses: actions/checkout@v4
        with:
          repository: AlienXAXS/StarRupture-Plugin-SDK
          ref: c00caebf3af1242bee5cfc1a66af8302096a369b
          path: plugin-sdk
          submodules: recursive

      # --------------------------------------------------------
      # Verify the expected SDK location
      # --------------------------------------------------------
      - name: Verify SDK location
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:GITHUB_WORKSPACE "plugin-sdk"
          $sdkRoot = [System.IO.Path]::GetFullPath($sdkRoot)

          Write-Host "Expected SDK location:"
          Write-Host $sdkRoot

          if (-not (Test-Path $sdkRoot)) {
            throw "StarRupture Plugin SDK was not found at: $sdkRoot"
          }

          Write-Host "SDK location verified."

      # --------------------------------------------------------
      # MSBuild
      # --------------------------------------------------------
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # --------------------------------------------------------
      # Determine and validate plugin version
      # --------------------------------------------------------
      - name: Verify source version
        shell: pwsh
        run: |
          $resourcePath = Join-Path $env:GITHUB_WORKSPACE $env:VERSION_HEADER

          if (-not (Test-Path $resourcePath)) {
            throw "Version header not found: $resourcePath"
          }

          $resource = Get-Content $resourcePath -Raw
          $versionPrefix = $env:BUILD_TARGET.ToUpperInvariant()

          $majorMatch = [regex]::Match(
            $resource,
            ('(?m)^[ \t]*#define[ \t]+{0}_VERSION_MAJOR[ \t]+([0-9]+)[ \t]*\r?$' -f $versionPrefix)
          )

          $minorMatch = [regex]::Match(
            $resource,
            ('(?m)^[ \t]*#define[ \t]+{0}_VERSION_MINOR[ \t]+([0-9]+)[ \t]*\r?$' -f $versionPrefix)
          )

          $patchMatch = [regex]::Match(
            $resource,
            ('(?m)^[ \t]*#define[ \t]+{0}_VERSION_PATCH[ \t]+([0-9]+)[ \t]*\r?$' -f $versionPrefix)
          )

          if (-not (
              $majorMatch.Success -and
              $minorMatch.Success -and
              $patchMatch.Success
          )) {
            throw "Could not determine DLL version from $resourcePath"
          }

          $version = "$($majorMatch.Groups[1].Value).$($minorMatch.Groups[1].Value).$($patchMatch.Groups[1].Value)"
          $versionTag = "v$version"

          Write-Host "resource.h version: $version"
          Write-Host "Release tag: $versionTag"

          "VERSION=$version" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          $serverVersionParts = foreach ($part in @('MAJOR', 'MINOR', 'PATCH')) {
            $match = [regex]::Match($resource,
              ('(?m)^[ \t]*#define[ \t]+SERVER_VERSION_{0}[ \t]+([0-9]+)[ \t]*\r?$' -f $part))
            if (-not $match.Success) { throw "Could not determine legacy Server version" }
            $match.Groups[1].Value
          }
          "LEGACY_SERVER_VERSION=$($serverVersionParts -join '.')" | Out-File `
            -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "VERSION_TAG=$versionTag" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

      - name: Check publication destination
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $destinationFilter = '.[] | select(.tag_name == "' + $env:VERSION_TAG + '")'
          $destinationJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" `
            --paginate --jq $destinationFilter
          if ($LASTEXITCODE -ne 0) {
            throw "Could not determine destination release state; publication refused"
          }
          if ([string]::IsNullOrWhiteSpace(($destinationJson -join "`n"))) {
            $releaseState = 'missing'
          } else {
            $destination = $destinationJson | ConvertFrom-Json
            if (-not $destination.draft -or $destination.published_at) {
              throw "Version $env:VERSION_TAG is already published and must not be modified"
            }
            $releaseState = 'draft'
            "RELEASE_ID=$($destination.id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          "RELEASE_STATE=$releaseState" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Destination $env:VERSION_TAG state: $releaseState"

      # --------------------------------------------------------
      # Read supported ModLoader interface range directly from
      # the SDK used for this build.
      # --------------------------------------------------------
      - name: Read ModLoader interface version
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:GITHUB_WORKSPACE "plugin-sdk"

          $sdkRoot = [System.IO.Path]::GetFullPath($sdkRoot)

          $interfaceHeader = Get-ChildItem `
            -Path $sdkRoot `
            -Recurse `
            -Filter "plugin_interface.h" `
            -File |
            Select-Object -First 1

          if (-not $interfaceHeader) {
            throw "Could not find plugin_interface.h in $sdkRoot"
          }

          Write-Host "Using interface header:"
          Write-Host $interfaceHeader.FullName

          $content = Get-Content $interfaceHeader.FullName -Raw

          $minMatch = [regex]::Match(
            $content,
            '#define\s+PLUGIN_INTERFACE_VERSION_MIN\s+(\d+)'
          )

          $maxMatch = [regex]::Match(
            $content,
            '#define\s+PLUGIN_INTERFACE_VERSION_MAX\s+(\d+)'
          )

          if (-not ($minMatch.Success -and $maxMatch.Success)) {
            throw "Could not determine ModLoader interface version range"
          }

          $interfaceMin = $minMatch.Groups[1].Value
          $interfaceMax = $maxMatch.Groups[1].Value

          Write-Host "Interface version minimum: $interfaceMin"
          Write-Host "Interface version maximum: $interfaceMax"

          "INTERFACE_VERSION_MIN=$interfaceMin" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          "INTERFACE_VERSION_MAX=$interfaceMax" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

      # --------------------------------------------------------
      # Build Client
      # --------------------------------------------------------
      - name: Build Client Release
        if: ${{ inputs.target == 'Client' }}
        shell: pwsh
        run: |
          $solution = Join-Path $env:GITHUB_WORKSPACE $env:SOLUTION_FILE

          msbuild $solution `
            /p:Configuration="$env:CLIENT_CONFIGURATION" `
            /p:Platform=x64 `
            /p:StarRupturePluginSDKRoot="$env:GITHUB_WORKSPACE\plugin-sdk\" `
            /m `
            /v:minimal

      # --------------------------------------------------------
      # Build Server
      # --------------------------------------------------------
      - name: Build Server Release
        if: ${{ inputs.target == 'Server' }}
        shell: pwsh
        run: |
          $solution = Join-Path $env:GITHUB_WORKSPACE $env:SOLUTION_FILE

          msbuild $solution `
            /p:Configuration="$env:SERVER_CONFIGURATION" `
            /p:Platform=x64 `
            /p:StarRupturePluginSDKRoot="$env:GITHUB_WORKSPACE\plugin-sdk\" `
            /m `
            /v:minimal

      # --------------------------------------------------------
      # Verify DLL/PDB output
      # --------------------------------------------------------
      - name: Verify build outputs
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "bin/x64/$env:BUILD_CONFIGURATION/plugins"
          foreach ($extension in @('dll', 'pdb')) {
            $file = Join-Path $output "$env:PLUGIN_NAME.$extension"
            if (-not (Test-Path $file)) {
              throw "Expected build output not found: $file"
            }
            $info = Get-Item $file
            Write-Host "$($info.FullName) - $($info.Length) bytes"
          }

      # --------------------------------------------------------
      # Verify DLL embedded version resources
      #
      # Windows commonly exposes the resource as four components,
      # e.g. 0.2.0.0, while our project version is 0.2.0.
      # Normalize both to three components before comparing.
      # --------------------------------------------------------
      - name: Verify DLL version resources
        shell: pwsh
        run: |
          $dlls = @(Join-Path $env:GITHUB_WORKSPACE `
            "bin/x64/$env:BUILD_CONFIGURATION/plugins/$env:PLUGIN_NAME.dll")

          foreach ($dll in $dlls) {
            $versionInfo = (Get-Item $dll).VersionInfo

            Write-Host ""
            Write-Host "DLL: $dll"
            Write-Host "FileVersion: $($versionInfo.FileVersion)"
            Write-Host "ProductVersion: $($versionInfo.ProductVersion)"

            $fileVersion = $versionInfo.FileVersion.Trim()
            $productVersion = $versionInfo.ProductVersion.Trim()

            $fileVersionNormalized = ($fileVersion -split '\.')[0..2] -join '.'
            $productVersionNormalized = ($productVersion -split '\.')[0..2] -join '.'

            if ($fileVersionNormalized -ne $env:VERSION) {
              throw "DLL FileVersion mismatch: expected $env:VERSION but found $fileVersion"
            }

            if ($productVersionNormalized -ne $env:VERSION) {
              throw "DLL ProductVersion mismatch: expected $env:VERSION but found $productVersion"
            }
          }

      # --------------------------------------------------------
      # Prepare package directories
      # --------------------------------------------------------
      - name: Prepare package directories
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "package"
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$packageRoot\$env:BUILD_TARGET\Plugins" |
            Out-Null

      # --------------------------------------------------------
      # Generate Client sidecar
      # --------------------------------------------------------
      - name: Generate Client sidecar manifest
        if: ${{ inputs.target == 'Client' }}
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE `
            "package\Client\Plugins\$env:PLUGIN_NAME.json"

          $manifest = @{
            manifest_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/$($env:PLUGIN_NAME)-client-manifest.json"
          } | ConvertTo-Json

          Set-Content `
            -Path $path `
            -Value $manifest `
            -Encoding utf8

          Write-Host "Generated $path"
          Get-Content $path

      # --------------------------------------------------------
      # Generate Server sidecar
      # --------------------------------------------------------
      - name: Generate Server sidecar manifest
        if: ${{ inputs.target == 'Server' }}
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE `
            "package\Server\Plugins\$env:PLUGIN_NAME.json"

          $manifest = @{
            manifest_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/$($env:PLUGIN_NAME)-server-manifest.json"
          } | ConvertTo-Json

          Set-Content `
            -Path $path `
            -Value $manifest `
            -Encoding utf8

          Write-Host "Generated $path"
          Get-Content $path

      # --------------------------------------------------------
      # Copy Client package files
      # --------------------------------------------------------
      - name: Stage Client package
        if: ${{ inputs.target == 'Client' }}
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE `
            "package\Client\Plugins"

          $clientDll = Join-Path $env:GITHUB_WORKSPACE `
            "bin/x64/$env:CLIENT_CONFIGURATION/plugins/$env:PLUGIN_NAME.dll"

          $clientPdb = Join-Path $env:GITHUB_WORKSPACE `
            "bin/x64/$env:CLIENT_CONFIGURATION/plugins/$env:PLUGIN_NAME.pdb"

          Copy-Item `
            $clientDll `
            (Join-Path $package "$env:PLUGIN_NAME.dll")

          Copy-Item `
            $clientPdb `
            (Join-Path $package "$env:PLUGIN_NAME.pdb")

          Copy-Item `
            $clientDll `
            (Join-Path $env:GITHUB_WORKSPACE "$env:PLUGIN_NAME-Client.dll")

      # --------------------------------------------------------
      # Copy Server package files
      # --------------------------------------------------------
      - name: Stage Server package
        if: ${{ inputs.target == 'Server' }}
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE `
            "package\Server\Plugins"

          $serverDll = Join-Path $env:GITHUB_WORKSPACE `
            "bin/x64/$env:SERVER_CONFIGURATION/plugins/$env:PLUGIN_NAME.dll"

          $serverPdb = Join-Path $env:GITHUB_WORKSPACE `
            "bin/x64/$env:SERVER_CONFIGURATION/plugins/$env:PLUGIN_NAME.pdb"

          Copy-Item `
            $serverDll `
            (Join-Path $package "$env:PLUGIN_NAME.dll")

          Copy-Item `
            $serverPdb `
            (Join-Path $package "$env:PLUGIN_NAME.pdb")

          Copy-Item `
            $serverDll `
            (Join-Path $env:GITHUB_WORKSPACE "$env:PLUGIN_NAME-Server.dll")

      # --------------------------------------------------------
      # Generate remote Client manifest
      #
      # This is NOT placed in the ZIP.
      # It will later become a GitHub Release asset.
      # --------------------------------------------------------
      - name: Generate Client release manifest
        if: ${{ inputs.target == 'Client' }}
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE `
            "$env:PLUGIN_NAME-client-manifest.json"

          $manifest = [ordered]@{
            plugin_name           = $env:PLUGIN_NAME
            version               = $env:VERSION
            interface_version_min = [int]$env:INTERFACE_VERSION_MIN
            interface_version_max = [int]$env:INTERFACE_VERSION_MAX
            download_url          = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:VERSION_TAG/$($env:PLUGIN_NAME)-Client.dll"
          } | ConvertTo-Json

          Set-Content `
            -Path $path `
            -Value $manifest `
            -Encoding utf8

          Write-Host "Generated $path"
          Get-Content $path

      # --------------------------------------------------------
      # Generate remote Server manifest
      # --------------------------------------------------------
      - name: Generate Server release manifest
        if: ${{ inputs.target == 'Server' }}
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE `
            "$env:PLUGIN_NAME-server-manifest.json"

          $manifest = [ordered]@{
            plugin_name           = $env:PLUGIN_NAME
            version               = $env:VERSION
            interface_version_min = [int]$env:INTERFACE_VERSION_MIN
            interface_version_max = [int]$env:INTERFACE_VERSION_MAX
            download_url          = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:VERSION_TAG/$($env:PLUGIN_NAME)-Server.dll"
          } | ConvertTo-Json

          Set-Content `
            -Path $path `
            -Value $manifest `
            -Encoding utf8

          Write-Host "Generated $path"
          Get-Content $path

      # --------------------------------------------------------
      # Create Client ZIP
      # --------------------------------------------------------
      - name: Create Client ZIP
        if: ${{ inputs.target == 'Client' }}
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE `
            "package\Client\Plugins"

          $zip = Join-Path $env:GITHUB_WORKSPACE `
            "$env:PLUGIN_NAME-Client-v$env:VERSION.zip"

          Compress-Archive `
            -Path $package `
            -DestinationPath $zip `
            -Force

          Write-Host "Created $zip"

      # --------------------------------------------------------
      # Create Server ZIP
      # --------------------------------------------------------
      - name: Create Server ZIP
        if: ${{ inputs.target == 'Server' }}
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE `
            "package\Server\Plugins"

          $zip = Join-Path $env:GITHUB_WORKSPACE `
            "$env:PLUGIN_NAME-Server-v$env:VERSION.zip"

          Compress-Archive `
            -Path $package `
            -DestinationPath $zip `
            -Force

          Write-Host "Created $zip"

      # --------------------------------------------------------
      # Verify generated manifests and package contents
      # --------------------------------------------------------
      - name: Verify packages and manifests
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $zip = Join-Path $root "$env:PLUGIN_NAME-$env:BUILD_TARGET-v$env:VERSION.zip"
          $manifestPath = Join-Path $root "$env:PLUGIN_NAME-$env:MANIFEST_TARGET-manifest.json"
          foreach ($file in @($zip, $manifestPath)) {
            if (-not (Test-Path $file)) {
              throw "Expected release artifact not found: $file"
            }
            $info = Get-Item $file
            if ($info.Length -eq 0) {
              throw "Artifact is empty: $file"
            }
            Write-Host "$($info.Name) - $($info.Length) bytes"
          }

          $sidecarPath = Join-Path $root "package\$env:BUILD_TARGET\Plugins\$env:PLUGIN_NAME.json"
          $sidecar = Get-Content $sidecarPath -Raw | ConvertFrom-Json
          $expectedManifestUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/$($env:PLUGIN_NAME)-$env:MANIFEST_TARGET-manifest.json"
          if ($sidecar.manifest_url -ne $expectedManifestUrl) {
            throw "Sidecar manifest_url mismatch"
          }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.plugin_name -ne $env:PLUGIN_NAME) {
            throw "Manifest plugin_name mismatch"
          }
          if ($manifest.version -ne $env:VERSION) {
            throw "Manifest version mismatch"
          }
          if ($manifest.interface_version_min -ne [int]$env:INTERFACE_VERSION_MIN) {
            throw "Manifest interface_version_min mismatch"
          }
          if ($manifest.interface_version_max -ne [int]$env:INTERFACE_VERSION_MAX) {
            throw "Manifest interface_version_max mismatch"
          }
          $expectedDownloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:VERSION_TAG/$($env:PLUGIN_NAME)-$env:BUILD_TARGET.dll"
          if ($manifest.download_url -ne $expectedDownloadUrl) {
            throw "Manifest download_url mismatch"
          }
          Write-Host "Verified $env:BUILD_TARGET release manifest for $($manifest.plugin_name) $($manifest.version)"

      # --------------------------------------------------------
      # Upload temporary GitHub Actions artifacts.
      #
      # IMPORTANT:
      # These are NOT GitHub Releases and are NOT Nexus uploads.
      # --------------------------------------------------------
      - name: Upload Client build artifact
        if: ${{ inputs.target == 'Client' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PLUGIN_NAME }}-Client-v${{ env.VERSION }}
          path: |
            ${{ github.workspace }}/${{ env.PLUGIN_NAME }}-Client-v${{ env.VERSION }}.zip
            ${{ github.workspace }}/${{ env.PLUGIN_NAME }}-Client.dll
            ${{ github.workspace }}/${{ env.PLUGIN_NAME }}-client-manifest.json
          if-no-files-found: error

      - name: Upload Server build artifact
        if: ${{ inputs.target == 'Server' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PLUGIN_NAME }}-Server-v${{ env.VERSION }}
          path: |
            ${{ github.workspace }}/${{ env.PLUGIN_NAME }}-Server-v${{ env.VERSION }}.zip
            ${{ github.workspace }}/${{ env.PLUGIN_NAME }}-Server.dll
            ${{ github.workspace }}/${{ env.PLUGIN_NAME }}-server-manifest.json
          if-no-files-found: error

      # --------------------------------------------------------
      # Create GitHub Release
      # --------------------------------------------------------
      - name: Verify and carry forward the other target's release assets
        if: ${{ (inputs.publish && github.ref == 'refs/heads/main') || (inputs.target == 'Client' && !inputs.publish && github.ref == 'refs/heads/develop') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repository = $env:GITHUB_REPOSITORY
          $otherTarget = if ($env:BUILD_TARGET -eq 'Client') { 'Server' } else { 'Client' }
          $otherManifestTarget = $otherTarget.ToLowerInvariant()
          $carryDirectory = Join-Path $env:RUNNER_TEMP 'PersistentIdFix-carried-assets'
          New-Item -ItemType Directory -Path $carryDirectory | Out-Null

          # Carry only verified assets from the current published release.
          $sourceJson = gh api "repos/$repository/releases/latest"
          if ($LASTEXITCODE -ne 0) { throw "No published assets available to carry forward" }
          $source = $sourceJson | ConvertFrom-Json

          $manifestName = "$env:PLUGIN_NAME-$otherManifestTarget-manifest.json"
          gh release download $source.tag_name --repo $repository `
            --pattern $manifestName --dir $carryDirectory
          if ($LASTEXITCODE -ne 0) { throw "Existing opposite-target manifest unavailable" }
          $manifestPath = Join-Path $carryDirectory $manifestName
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.plugin_name -ne $env:PLUGIN_NAME -or -not $manifest.version) {
            throw "Invalid carried manifest identity or version"
          }
          if ($otherTarget -eq 'Server' -and $manifest.version -ne $env:LEGACY_SERVER_VERSION) {
            throw "Carried Server version must remain $env:LEGACY_SERVER_VERSION"
          }

          $dllName = "$env:PLUGIN_NAME-$otherTarget.dll"
          $zipName = "$env:PLUGIN_NAME-$otherTarget-v$($manifest.version).zip"
          gh release download $source.tag_name --repo $repository `
            --pattern $dllName --pattern $zipName --dir $carryDirectory
          if ($LASTEXITCODE -ne 0) { throw "Existing opposite-target DLL or ZIP unavailable" }

          # Preserve the original bytes of all three files, including the manifest.
          foreach ($name in @($manifestName, $dllName, $zipName)) {
            $asset = @($source.assets | Where-Object name -eq $name)
            if ($asset.Count -ne 1 -or $asset[0].digest -notmatch '^sha256:[0-9a-fA-F]{64}$') {
              throw "Missing or unverifiable carried asset: $name"
            }
            $file = Join-Path $carryDirectory $name
            $digest = 'sha256:' + (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($digest -ne $asset[0].digest -or (Get-Item $file).Length -ne $asset[0].size) {
              throw "Carried asset digest or size mismatch: $name"
            }
          }

          # The unchanged manifest must still point to an existing identical DLL.
          $urlPattern = '^https://github\.com/' + [regex]::Escape($repository) +
            '/releases/download/([^/]+)/' + [regex]::Escape($dllName) + '$'
          $urlMatch = [regex]::Match($manifest.download_url, $urlPattern)
          if (-not $urlMatch.Success) { throw "Unexpected carried DLL download URL" }
          $originalTag = [uri]::UnescapeDataString($urlMatch.Groups[1].Value)
          $originalJson = gh api "repos/$repository/releases/tags/$originalTag"
          if ($LASTEXITCODE -ne 0) { throw "Carried manifest's original release is unavailable" }
          $original = $originalJson | ConvertFrom-Json
          $originalDll = @($original.assets | Where-Object browser_download_url -eq $manifest.download_url)
          $carriedDll = @($source.assets | Where-Object name -eq $dllName)
          if ($original.draft -or $originalDll.Count -ne 1 -or
              $originalDll[0].digest -ne $carriedDll[0].digest -or
              $originalDll[0].size -ne $carriedDll[0].size) {
            throw "Carried manifest does not point to an identical published DLL"
          }

          "CARRY_DIRECTORY=$carryDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CARRY_DLL_NAME=$dllName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CARRY_MANIFEST_NAME=$manifestName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CARRY_ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Carrying $otherTarget $($manifest.version) unchanged from $($source.tag_name)"

      - name: Upload carried Server assets artifact
        if: ${{ inputs.target == 'Client' && !inputs.publish && github.ref == 'refs/heads/develop' }}
        uses: actions/upload-artifact@v6
        with:
          name: PersistentIdFix-Server-v1.3.1-Carried
          path: |
            ${{ runner.temp }}/PersistentIdFix-carried-assets/PersistentIdFix-server-manifest.json
            ${{ runner.temp }}/PersistentIdFix-carried-assets/PersistentIdFix-Server.dll
            ${{ runner.temp }}/PersistentIdFix-carried-assets/PersistentIdFix-Server-v1.3.1.zip
          if-no-files-found: error

      - name: Publish complete GitHub Release assets
        id: publish_release
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $root = $env:GITHUB_WORKSPACE
          $selectedAssets = @(
            (Join-Path $root "$env:PLUGIN_NAME-$env:BUILD_TARGET.dll"),
            (Join-Path $root "$env:PLUGIN_NAME-$env:MANIFEST_TARGET-manifest.json"),
            (Join-Path $root "$env:PLUGIN_NAME-$env:BUILD_TARGET-v$env:VERSION.zip")
          )
          $carriedAssets = @(
            (Join-Path $env:CARRY_DIRECTORY $env:CARRY_DLL_NAME),
            (Join-Path $env:CARRY_DIRECTORY $env:CARRY_MANIFEST_NAME),
            (Join-Path $env:CARRY_DIRECTORY $env:CARRY_ZIP_NAME)
          )
          $assets = $selectedAssets + $carriedAssets

          if ($env:RELEASE_STATE -eq 'draft') {
            # Recheck before mutation, then validate every existing asset before uploading any.
            $draftJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
            if ($LASTEXITCODE -ne 0) { throw "Could not recheck destination draft" }
            $draft = $draftJson | ConvertFrom-Json
            if (-not $draft.draft -or $draft.published_at) {
              throw "Version $env:VERSION_TAG is already published and must not be modified"
            }
            $expectedNames = @($assets | ForEach-Object { [System.IO.Path]::GetFileName($_) })
            foreach ($asset in $draft.assets) {
              if ($asset.name -notin $expectedNames) {
                throw "Unexpected draft asset '$($asset.name)'; consistency cannot be established"
              }
            }
            $missingAssets = @()
            foreach ($file in $assets) {
              $name = [System.IO.Path]::GetFileName($file)
              $existing = @($draft.assets | Where-Object name -eq $name)
              if ($existing.Count -eq 0) {
                $missingAssets += $file
                continue
              }
              $digest = 'sha256:' + (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($existing.Count -ne 1 -or $existing[0].digest -ne $digest -or
                  $existing[0].size -ne (Get-Item $file).Length) {
                throw "Conflicting draft asset '$name'; existing assets will not be overwritten"
              }
            }
            if ($missingAssets.Count -gt 0) {
              gh release upload $env:VERSION_TAG @missingAssets
              if ($LASTEXITCODE -ne 0) { throw "GitHub draft asset upload failed" }
            }
          } elseif ($env:RELEASE_STATE -eq 'missing') {
            # Keep the new release unpublished until both targets' assets are attached.
            gh release create $env:VERSION_TAG @assets `
              --title "$env:PLUGIN_NAME $env:VERSION_TAG" `
              --generate-notes --draft
            if ($LASTEXITCODE -ne 0) { throw "GitHub draft release creation failed" }
          } else {
            throw "Unknown destination release state; publication refused"
          }

          # Require a complete, matching draft immediately before publishing it.
          $destinationFilter = '.[] | select(.tag_name == "' + $env:VERSION_TAG + '")'
          $completeJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" `
            --paginate --jq $destinationFilter
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($completeJson -join "`n"))) {
            throw "Could not verify complete destination draft"
          }
          $complete = $completeJson | ConvertFrom-Json
          if (-not $complete.draft -or $complete.published_at) {
            throw "Version $env:VERSION_TAG is already published and must not be modified"
          }
          foreach ($file in $assets) {
            $name = [System.IO.Path]::GetFileName($file)
            $remote = @($complete.assets | Where-Object name -eq $name)
            $digest = 'sha256:' + (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($remote.Count -ne 1 -or $remote[0].digest -ne $digest -or
                $remote[0].size -ne (Get-Item $file).Length) {
              throw "Draft asset '$name' is missing or inconsistent; publication refused"
            }
          }
          $latest = if ($env:BUILD_TARGET -eq 'Client') { '--latest' } else { '--latest=false' }
          gh release edit $env:VERSION_TAG --draft=false $latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed" }
          "published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # --------------------------------------------------------
      # Upload Client package to Nexus Mods
      # --------------------------------------------------------
      - name: Upload Client build to Nexus Mods
        if: ${{ steps.publish_release.outputs.published == 'true' && inputs.target == 'Client' && inputs.publish && github.ref == 'refs/heads/main' }}
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUS_APIKEY }}
          file_id: ${{ secrets.NEXUS_CLIENT_GROUP_ID }}
          filename: ${{ github.workspace }}\${{ env.PLUGIN_NAME }}-Client-v${{ env.VERSION }}.zip
          archive_existing_version: true
          allow_mod_manager_download: false
          display_name: "${{ env.PLUGIN_NAME }} Client v${{ env.VERSION }}"
          description: "Changelog: https://github.com/${{ github.repository }}/releases/tag/v${{ env.VERSION }}"
          version: ${{ env.VERSION }}

      # --------------------------------------------------------
      # Upload Server package to Nexus Mods
      # --------------------------------------------------------
      - name: Upload Server build to Nexus Mods
        if: ${{ steps.publish_release.outputs.published == 'true' && inputs.target == 'Server' && inputs.publish && github.ref == 'refs/heads/main' }}
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUS_APIKEY }}
          file_id: ${{ secrets.NEXUS_SERVER_GROUP_ID }}
          filename: ${{ github.workspace }}\${{ env.PLUGIN_NAME }}-Server-v${{ env.VERSION }}.zip
          archive_existing_version: true
          allow_mod_manager_download: false
          display_name: "${{ env.PLUGIN_NAME }} Server v${{ env.VERSION }}"
          description: "Changelog: https://github.com/${{ github.repository }}/releases/tag/v${{ env.VERSION }}"
          version: ${{ env.VERSION }}
          update_mod_version: true
